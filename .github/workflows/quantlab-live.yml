name: quantlab-live
# Live paper trading for the Quant Lab's Statistical Arbitrage Lab during US market
# hours (09:30–16:00 ET = 20:00–02:30 IST). Three back-to-back jobs of up to ~3 h each
# cover the session in both summer and winter time; the engine polls quotes about
# once a minute and stops early after the close. Paper only — no orders are sent.
on:
  schedule:
    - cron: '20 13 * * 1-5'
    - cron: '15 16 * * 1-5'
    - cron: '10 19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quantlab-live
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-version
          sparse-checkout: quantlab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: quantlab/requirements.txt
      - run: pip install -r quantlab/requirements.txt
      - name: Live paper trading
        working-directory: quantlab
        env:
          DATABASE_URL: ${{ secrets.QL_DATABASE_URL }}
        run: python -m ql.live --minutes 172

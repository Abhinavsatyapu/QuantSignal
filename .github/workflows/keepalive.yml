name: keepalive
# Pings the Render free instance so it does not spin down (free web services sleep after ~15 min idle).
# Set the repository variable RENDER_HEALTH_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://quantsignal.onrender.com/health
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.RENDER_HEALTH_URL || 'https://quantsignal.onrender.com/health' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 90 "$URL") || code=000
            echo "attempt $i: HTTP $code $(head -c 200 /tmp/body 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1

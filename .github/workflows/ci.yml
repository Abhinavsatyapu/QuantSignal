name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (same Dockerfile Render uses)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quantsignal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health and /version
        run: |
          docker run -d --name qs -p 8787:8787 -e NETWORK=testnet -e DRY_RUN=1 -e HOST=0.0.0.0 -e PORT=8787 quantsignal:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8787/health | grep '"ok":true'
          curl -fsS http://127.0.0.1:8787/version
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/builder)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/weekly)" = 200
          docker logs qs | tail -20

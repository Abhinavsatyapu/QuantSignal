<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Futures Overview · QuantSignal</title>
<link rel="stylesheet" href="/ds.css">
<style>
.curve-wrap{height:220px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
.curve-wrap canvas{width:100%;height:100%;display:block}
.sig-feed{font-size:12.5px;max-height:320px;overflow:auto}
.sig-feed table{width:100%}
.preset-line{font-family:var(--mono);font-size:12px;color:var(--text2);margin:0 0 16px}
</style>
</head>
<body class="qs-app">
<main>
  <p class="page-sub muted" style="margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase">Binance USDⓈ-M · US equity TradFi perps</p>
  <h1 class="page-title">Futures Overview</h1>
  <p class="page-sub" id="srcLine">Connecting to Binance price feed…</p>
  <p class="page-sub" id="geoNote" hidden style="color:var(--amber)"></p>
  <p class="preset-line" id="presetLine">Active preset: —</p>

  <div class="kpi-row" id="kpis"></div>

  <div class="grid-2">
    <section class="panel">
      <h2>Equity curve · closed trades (60 IST days)</h2>
      <div class="curve-wrap"><canvas id="eqCanvas" width="720" height="220"></canvas></div>
      <div class="kpi-row" id="avgDaily" style="margin-top:12px"></div>
      <p class="muted" id="avgDailyNote" style="font-size:12px">Live dry-run / live closed-trade equity — not a backtest.</p>
    </section>
    <section class="panel">
      <h2>Recent signals</h2>
      <div class="sig-feed table-wrap" id="sigFeed"><p class="muted">Loading…</p></div>
    </section>
  </div>
</main>
<script src="/futures.js"></script>
<script src="/shell.js"></script>
<script src="/auth-ui.js"></script>
</body>
</html>

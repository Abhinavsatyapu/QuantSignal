# Render Blueprint: QuantSignal US-stock-perp Auto-Trader (Hyperliquid TESTNET by default)
services:
  - type: web
    name: quantsignal
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # free instances sleep after ~15 min idle -> .github/workflows/keepalive.yml pings /health
    region: singapore
    numInstances: 1          # SQLite + one execution engine: never scale >1
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # deploy main only after GitHub CI (tests + Docker build) passes
    # Free plan has no persistent disk: DATA_DIR is ephemeral. Strategy History / plans / model versions / settings are
    # mirrored to Postgres when DATABASE_URL is set (Neon free tier) and restored on boot — see server/persist.js.
    envVars:
      - key: DATA_DIR
        value: /tmp/data
      - key: NETWORK
        value: testnet
      - key: HOST
        value: 0.0.0.0
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: HL_TESTNET_PRIVATE_KEY
        sync: false          # set in the Render dashboard (secret)
      - key: HL_ACCOUNT_ADDRESS
        sync: false
      - key: ALPACA_KEY_ID
        sync: false          # secret, set in the Render dashboard
      - key: ALPACA_SECRET_KEY
        sync: false          # secret, set in the Render dashboard
      - key: DATABASE_URL
        sync: false          # Neon pooled connection string (secret, set in the dashboard / via API)
      - key: ALPACA_OPTIONS_FEED
        value: indicative

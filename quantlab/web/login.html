<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant Lab · Sign in</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#e6e9ee;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
form{width:min(360px,90vw);background:#11161d;border:1px solid #1f2833;border-radius:12px;padding:28px}
h1{font-size:18px;margin:0 0 4px;letter-spacing:.02em}h1 span{color:#3987e5}p{margin:0 0 20px;color:#9aa4b2;font-size:13px}
input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:8px;border:1px solid #2a3442;background:#0b0f14;color:#e6e9ee;font-size:15px}
button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:#3987e5;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
#e{color:#e66767;font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f"><h1>Quant<span>Lab</span></h1><p>Statistical-arbitrage research · paper only</p>
<input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
<button>Sign in</button><div id="e"></div></form>
<script>
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const r=await fetch('/login',{method:'POST',body:new FormData(ev.target)});
if(r.ok)location.href='/';else document.getElementById('e').textContent=(await r.json().catch(()=>({}))).error||'Sign-in failed';};
</script></body></html>

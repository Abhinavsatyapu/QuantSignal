<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Portal</title>
<meta name="theme-color" content="#0b0d11">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d11;--card:#171a21;--card2:#1c2028;--line:#2a303b;--ink:#e8eaee;--muted:#8b93a1;--faint:#6d7583;--amber:#d7a441;--f:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:4;background:rgba(11,13,17,.92);backdrop-filter:blur(10px)}
.bar{max-width:1180px;margin:0 auto;padding:18px 28px 8px;display:flex;align-items:center;gap:16px}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.spacer{margin-left:auto}
.out{color:#9ec0ff;font-size:14px}.out:hover{text-decoration:underline}
main{max-width:1180px;margin:0 auto;padding:8px 28px 72px}
h2{margin:34px 0 14px;font:600 11px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;color:#6a7280}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;min-height:148px;background:var(--card);border:1px solid transparent;border-radius:14px;padding:18px 18px 16px}
a.card:hover{background:var(--card2);border-color:var(--line)}
a.card:focus-visible{outline:2px solid #6ea2ff;outline-offset:2px}
.card h3{margin:0;font:600 15px/1.3 var(--f);letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.card .nb{margin-top:auto;color:var(--amber);font:600 11px/1 var(--f);letter-spacing:.04em}
.card.planned{cursor:default}
.searchrow{display:flex;gap:10px;align-items:center;margin-top:6px}
.search{flex:1;max-width:280px;background:#12151b;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font:13px var(--f)}
.search:focus{outline:none;border-color:#4d607a}
.empty{display:none;color:var(--faint);margin-top:28px}
footer{max-width:1180px;margin:0 auto;padding:0 28px 36px;color:#5c6572;font-size:12px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.bar,main,footer{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">Dashboard Portal</div>
  <div class="spacer"></div>
  <a class="out" href="/logout">Sign out</a>
</div></header>
<main>
  <div class="searchrow"><input id="q" class="search" type="search" placeholder="Filter cards" aria-label="Filter cards"></div>
  <div id="sections"></div>
  <p class="empty" id="empty">No card matches that filter.</p>
</main>
<footer>Every card opens a page. Prices are Yahoo, options are Yahoo's nearest expiry, yields are Treasury.gov, and the fear index is CNN. FRED is used when it answers. Nothing on this portal sends a live broker order.</footer>
<script>
const S = [
  ['Macro Review', [
    ['Macro Fundamentals', 'OHLCV for the major ETFs and VIX from Yahoo daily bars. Session change, 5/20/60-session returns, and RVOL.', '/macro'],
    ['Macro Quants', 'Sector ETFs versus SPY. Phase is the 50-day and 200-day EMA rule documented on the page. Leaders and laggards are the 20-session relative return.', '/macro-quants'],
    ['Macros — Block by Block', 'Treasury curve, CNN Fear & Greed, HYG/IEF credit, UUP, and the SPY 60-session growth proxy. FRED blocks stay blank when FRED does not answer.', '/macro-blocks'],
    ['Cohort Review', 'Sector-ETF phase: gestation, ignition, mature, break, repair. Read only.', '/cohorts'],
    ['Cohort Strategies', 'Which of the documented cohort rules are on from the latest Yahoo pass.', '/cohort-strategies'],
  ]],
  ['GEX (SIMPLIFIED_US_TS)', [
    ['Gamma — Swing Alerts', 'Danger Zones, campaigns, cockpit, flip, S1–S6, ignition, washout, and credit from the Yahoo option pass. Read only.', '/swing'],
    ['Gex (Source Corrected)', 'Zone Monitor. Yahoo options when Alpaca keys are unset, Cboe only if Yahoo fails. Read only.', '/zone'],
  ]],
  ['Engines (SIMPLIFIED_US_TS)', [
    ['RVOL & Order Flow — read only', 'Stock RVOL versus the prior 20 sessions, volume velocity, and call-minus-put contract volume on the nearest expiry. No signed flow feed.', '/rvol'],
    ['OMS', 'Order entry stays on the paper host. Live Alpaca orders are refused even if the live switches are set.', '/oms'],
    ['0DTE-Caps', '0DTE CAPPED → rest-of-day short, PAPER. The 10:30 read, lid stop, 15:50 cover, same-day control, and the 100-trade scorecard. View only, no orders.', '/0dte'],
  ]],
  ['Cohort Navigation Strategy', [
    ['Planning — Phase Navigation', 'Today\'s mode per sector ETF. PAPER WATCH or stand aside. Read only.', '/plan'],
    ['Fleet — Launch & Oversight', 'Paper roster of ignition and mature cohorts. Share count stays 0. Nothing launches.', '/fleet'],
    ['Execution — Grid (instance)', 'Paper levels at ±1%, ±2%, and ±3% of the lead cohort\'s last trade. Nothing is sent.', '/grid'],
    ['Config (instance)', 'The documented inputs. Rebalance is off. No order leaves this page.', '/config'],
    ['PnL (instance)', 'One-share session mark of each sector ETF. Not a booked position.', '/pnl'],
  ]],
  ['Grid Bots', [
    ['4000 series bots — 1 or 2 leg put combo with grid', 'Paper sketch of a short put at the put wall. No bot is launched and no order is sent.', '/bots'],
    ['Structure Planner — size a position, see the payoff at expiry', 'SPY short-put intrinsic payoff versus the share, from the live put wall. Never trades.', '/planner'],
  ]],
  ['Quant Signals', [
    ['Trading Terminal', 'US stock perps, market regime, stock vs perp, and the live scanner.', '/terminal'],
    ['Trading Signals', 'Closed-candle signals: entry zone, stop, and targets.', '/signals'],
    ['Global News', 'Market-moving headlines from public publisher feeds.', '/news'],
    ['Options Studio', 'Option chains, strategy payoffs, and Greeks.', '/options'],
    ['Gamma Book', 'Strike-by-strike gamma and open interest.', '/gamma'],
    ['Live Hedge Compare', 'Compare hedges against the live chain.', '/hedge'],
    ['1:2 Options + Futures', 'Ratio setups that pair an option spread with a perp.', '/ratio'],
    ['Sheet Scenario Lab', 'Scenario grid for multi-leg positions.', '/sheet-lab'],
    ['Manual Four-Leg Lab', 'Any four-leg structure, with payoff and breakevens.', '/manual'],
    ['Paper Trading', 'Paper account on the signal rules. No live orders.', '/paper'],
    ['Risk Calculator', 'Position size from account, risk, entry, and stop.', '/risk'],
    ['Webhook Lab', 'Validate TradingView-style alert payloads.', '/webhook'],
  ]],
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.getElementById('sections').innerHTML = S.map(([name, cards]) => `<section data-sec><h2>${esc(name)}</h2><div class="grid">${cards.map(([t, d, href]) => {
  const inner = `<h3>${esc(t)}</h3><p>${esc(d)}</p>${href ? '' : '<span class="nb">NOT BUILT YET</span>'}`;
  const q = esc((t + ' ' + d + ' ' + name).toLowerCase());
  return href ? `<a class="card" href="${esc(href)}" data-q="${q}">${inner}</a>` : `<div class="card planned" data-q="${q}">${inner}</div>`;
}).join('')}</div></section>`).join('');
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll('[data-sec]').forEach(sec => { let n = 0; sec.querySelectorAll('.card').forEach(c => { const ok = !q || c.dataset.q.includes(q); c.style.display = ok ? '' : 'none'; n += ok; }); sec.style.display = n ? '' : 'none'; shown += n; });
  document.getElementById('empty').style.display = shown ? 'none' : 'block';
});
</script>
</body>
</html>

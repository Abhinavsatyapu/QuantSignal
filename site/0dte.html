<style>
body{background:#0c1016}

.pass{color:#3dce86}.fail{color:#ff8d96}.wait{color:#e6b15c}
.pnlpos{color:#3dce86}.pnlneg{color:#ff8d96}

h2.sec{margin:18px 0 8px;font:600 12px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#9aa6b5}
.banner.retired{border-color:#e2454f;color:#ffb4b8}
